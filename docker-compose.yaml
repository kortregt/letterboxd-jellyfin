services:
  moviepicker:
    build: .
    container_name: moviepicker
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - kortregt_network

networks:
  kortregt_network:
    external: true
