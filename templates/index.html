<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Picker</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Movie Picker</h1>
            <p class="subtitle">Letterboxd + Jellyfin</p>
        </header>

        <div id="warnings" class="warnings hidden" role="status"></div>

        <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="random" role="tab" aria-selected="true">Random Picker</button>
            <button class="tab" data-tab="overlap" role="tab" aria-selected="false">Friend Overlap</button>
            <button class="tab" data-tab="missing" role="tab" aria-selected="false">Movies to Add</button>
        </nav>

        <!-- Random Picker -->
        <section id="tab-random" class="tab-content active" role="tabpanel">
            <div class="filters-section">
                <button id="toggle-filters" class="btn-secondary" aria-expanded="false">Show Filters</button>
                <div id="filters-panel" class="filters-panel hidden">
                    <div class="filter-group">
                        <label for="genre-select">Genre <span class="hint">(ctrl/cmd-click for several)</span></label>
                        <select id="genre-select" multiple></select>
                    </div>
                    <div class="filter-group">
                        <label for="year-min">Year range</label>
                        <div class="range-inputs">
                            <input type="number" id="year-min" placeholder="Any" min="1870" max="2100" aria-label="Earliest year">
                            <span>to</span>
                            <input type="number" id="year-max" placeholder="Any" min="1870" max="2100" aria-label="Latest year">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="runtime-min">Runtime (minutes)</label>
                        <div class="range-inputs">
                            <input type="number" id="runtime-min" placeholder="Any" min="0" max="1000" aria-label="Shortest runtime">
                            <span>to</span>
                            <input type="number" id="runtime-max" placeholder="Any" min="0" max="1000" aria-label="Longest runtime">
                        </div>
                    </div>
                    <button id="clear-filters" class="btn-secondary btn-small">Clear filters</button>
                </div>
            </div>
            <div class="action-section">
                <button id="get-movie-btn" class="btn-primary">Pick Random Movie</button>
            </div>
            <div id="random-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Finding a movie…</p>
            </div>
            <div id="random-error" class="error-message hidden"></div>
            <div id="movie-card" class="movie-card hidden">
                <div class="movie-poster">
                    <img id="movie-image" src="" alt="">
                </div>
                <div class="movie-details">
                    <h2 id="movie-title"></h2>
                    <div id="movie-meta" class="movie-meta"></div>
                    <div id="movie-genres" class="genres"></div>
                    <p id="movie-overview" class="overview"></p>
                </div>
            </div>
        </section>

        <!-- Friend Overlap -->
        <section id="tab-overlap" class="tab-content" role="tabpanel">
            <div class="list-controls">
                <div class="control-row">
                    <div class="friend-filter" id="overlap-friend-filter"></div>
                </div>
                <div class="control-row">
                    <div class="segmented" role="group" aria-label="Friend match mode">
                        <label><input type="radio" name="overlap-match" value="any" checked><span>Any of them</span></label>
                        <label><input type="radio" name="overlap-match" value="all"><span>All of them</span></label>
                    </div>
                    <label class="toggle-label">
                        <input type="checkbox" id="jellyfin-only">
                        On Jellyfin only
                    </label>
                </div>
                <div class="control-row">
                    <input type="search" id="overlap-search" class="search-input" placeholder="Search these films…" aria-label="Search overlap results">
                    <button id="overlap-random-btn" class="btn-primary">Pick From These</button>
                </div>
            </div>
            <div id="overlap-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading watchlists…</p>
            </div>
            <div id="overlap-error" class="error-message hidden"></div>
            <div id="overlap-random-result" class="overlap-random-result hidden"></div>
            <p id="overlap-count" class="result-count hidden"></p>
            <div id="overlap-list" class="movie-list"></div>
            <div class="load-more-wrap">
                <button id="overlap-more" class="btn-secondary hidden">Show more</button>
            </div>
            <div id="overlap-empty" class="empty-state hidden"></div>
        </section>

        <!-- Movies to Add -->
        <section id="tab-missing" class="tab-content" role="tabpanel">
            <div class="list-controls">
                <div class="control-row">
                    <div class="friend-filter" id="missing-friend-filter"></div>
                </div>
                <div class="control-row">
                    <div class="segmented" role="group" aria-label="Friend match mode">
                        <label><input type="radio" name="missing-match" value="any" checked><span>Any of them</span></label>
                        <label><input type="radio" name="missing-match" value="all"><span>All of them</span></label>
                    </div>
                </div>
                <div class="control-row">
                    <input type="search" id="missing-search" class="search-input" placeholder="Search these films…" aria-label="Search missing films">
                </div>
            </div>
            <div id="missing-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading watchlists…</p>
            </div>
            <div id="missing-error" class="error-message hidden"></div>
            <p id="missing-count" class="result-count hidden"></p>
            <div id="missing-list" class="movie-list"></div>
            <div class="load-more-wrap">
                <button id="missing-more" class="btn-secondary hidden">Show more</button>
            </div>
            <div id="missing-empty" class="empty-state hidden"></div>
        </section>

        <footer>
            <span id="sync-status" class="sync-status"></span>
            <button id="refresh-cache" class="btn-secondary btn-small">Refresh data</button>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
